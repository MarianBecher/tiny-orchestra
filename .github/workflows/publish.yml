name: Publish

# Releases a version to npm when a plain semver tag like 1.2.3 (no `v`) is
# pushed: `npm version patch && git push --follow-tags` - the repository's
# .npmrc drops npm's `v` prefix. Authentication uses npm Trusted Publishing
# (OIDC) - no NPM_TOKEN secret.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5
      - run: npm install -g npm@latest
      - name: Check that the tag matches package.json
        run: |
          expected="$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
