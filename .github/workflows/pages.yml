name: Pages

# Publishes site/ on GitHub Pages, with the built library next to it in lib/
# and the samples in samples/ - the paths the site uses (and that
# scripts/serve.ts reproduces locally). Needs Settings > Pages > Source:
# GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r dist _site/lib
          cp -r samples _site/samples
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
